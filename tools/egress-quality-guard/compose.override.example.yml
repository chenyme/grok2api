# Merge this file with the repository's main docker-compose.yml.
# Keep the real environment file outside the repository with mode 0600.
services:
  grok2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${GROK2API_IMAGE:-grok2api-egress-enhanced:local}"
    environment:
      QUALITY_GUARD_STATE_FILE: /var/lib/grok2api-quality-guard/state.json
      QUALITY_GUARD_RUNTIME_CONFIG_FILE: /var/lib/grok2api-quality-guard/runtime-config.json
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard

  egress-quality-guard:
    profiles: ["quality-guard"]
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    depends_on:
      grok2api:
        condition: service_healthy
    env_file:
      - path: "${QUALITY_GUARD_ENV_FILE:-./tools/egress-quality-guard/egress-quality-guard.env}"
        required: false
    environment:
      GROK2API_BASE_URL: http://grok2api:8000
      QUALITY_GUARD_STATE_FILE: /var/lib/grok2api-quality-guard/state.json
      QUALITY_GUARD_LOCK_FILE: /var/lib/grok2api-quality-guard/guard.lock
      QUALITY_GUARD_RUNTIME_CONFIG_FILE: /var/lib/grok2api-quality-guard/runtime-config.json
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: unless-stopped

volumes:
  quality_guard_state:
